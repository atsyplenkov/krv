name: wdc_3_0
version: 4.6.0+14
publish_to: "none"

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  archive: 4.0.9
  crypto: 3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  geolocator: ^13.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/legal/LICENSE
    - assets/legal/NOTICE
    - assets/icon/app_icon.png
    - assets/fonts/LICENSE-Roboto.txt
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Medium.ttf
  fonts:
    - family: WdcReport
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 700
